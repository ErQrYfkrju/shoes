# KCP server and a local SOCKS listener that reaches it through a KCP client.
- address: "127.0.0.1:19090"
  transport: kcp
  kcp_settings:
    mode: file_transfer
    send_window: 256
    recv_window: 256
    mtu: 1400
    max_sessions: 128
  protocol:
    type: socks

- address: "127.0.0.1:1080"
  protocol:
    type: socks
  rules:
    - masks: "0.0.0.0/0"
      action: allow
      client_chain:
        address: "127.0.0.1:19090"
        transport: kcp
        kcp_settings:
          mode: file_transfer
          send_window: 256
          recv_window: 256
          mtu: 1400
          max_sessions: 128
        protocol:
          type: socks
