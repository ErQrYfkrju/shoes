# Representative Android VPN configuration; the service replaces device_fd at runtime.
- device_fd: -1
  mtu: 9000
  tcp_enabled: true
  udp_enabled: true
  rules:
    - masks: "0.0.0.0/0"
      action: allow
      client_chain:
        address: "server.example.com:19090"
        transport: kcp
        kcp_settings:
          mode: file_transfer
          send_window: 256
          recv_window: 256
          mtu: 1400
          max_sessions: 128
        protocol:
          type: socks
